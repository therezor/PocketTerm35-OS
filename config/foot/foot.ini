# foot on a 640x480 panel.
font=DejaVu Sans Mono:size=11
pad=2x2 center
dpi-aware=no

[scrollback]
lines=5000

[cursor]
style=block
blink=yes
color=0a1310 3ddc97

[colors]
background=0a1310
foreground=dcf3e5
regular0=121f1a
regular1=ef6b73
regular2=3ddc97
regular3=e8c468
regular4=5fd0e8
regular5=9ad9c0
regular6=5fd0e8
regular7=dcf3e5
# Dim text (darkwire's labels, shell hints): the shell's muted colour, 6.8:1.
bright0=7aa48e
bright2=6ff0b4

[key-bindings]
font-increase=Control+plus
font-decrease=Control+minus
font-reset=Control+0
# Scroll Lock (Fn+M) browses the scrollback: the D-pad by line, Fn+B and Fn+N
# by page, Home and End to the ends. Scroll Lock or Escape (B) leaves.
# Typing searches.
search-start=Control+Shift+r Scroll_Lock

[search-bindings]
cancel=Control+g Control+c Escape Scroll_Lock
scrollback-up-line=Up
scrollback-down-line=Down
scrollback-up-page=Page_Up Shift+Page_Up
scrollback-down-page=Page_Down Shift+Page_Down
scrollback-home=Home
scrollback-end=End
cursor-home=Control+a
cursor-end=Control+e
